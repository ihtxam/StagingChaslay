name: Build Chaslay POS Windows

# NSIS installer for the Tauri kiosk shell. Must run on windows-latest (WebView2 + MSVC).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/build-chaslay-pos-windows.yml'

concurrency:
  group: build-chaslay-pos-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        env:
          CHASLAY_POS_URL: https://app.chaslay.com/login
        run: npm run build:nsis

      - name: Stage download files
        shell: pwsh
        run: |
          $out = "desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$out/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found under $out" }
          New-Item -ItemType Directory -Force -Path backend/public/downloads | Out-Null
          Copy-Item $exe.FullName backend/public/downloads/chaslay-pos-setup.exe
          Write-Host "Installer: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Update download manifest
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $manifest = @{
            name = "chaslay-pos"
            displayName = "Chaslay POS"
            description = "Fullscreen Windows kiosk for Chaslay WebPOS. Hardware uses the Print Agent on 127.0.0.1:9101."
            version = $version
            exeFile = "chaslay-pos-setup.exe"
            platform = "windows"
            builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            signed = $false
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content backend/public/downloads/chaslay-pos-setup.json

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaslay-pos-windows-${{ github.sha }}
          path: |
            backend/public/downloads/chaslay-pos-setup.exe
            backend/public/downloads/chaslay-pos-setup.json
          retention-days: 90
