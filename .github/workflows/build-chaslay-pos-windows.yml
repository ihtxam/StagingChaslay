name: Build RebornPOS Windows

# NSIS installer for the Tauri kiosk shell. Must run on Windows (WebView2 + MSVC).
# Installer is SCP'd to app.rebornsense.com on main (no GitHub artifact upload — avoids storage quota).
# Offline fallback when GitHub billing blocks windows-latest:
#   powershell -ExecutionPolicy Bypass -File scripts/build-reborn-pos-windows.ps1 -Publish
# Or register a self-hosted Windows runner with label "windows" and set runs-on below.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/build-chaslay-pos-windows.yml'

concurrency:
  group: build-reborn-pos-windows
  cancel-in-progress: false

jobs:
  build-windows:
    # Self-hosted: change to [self-hosted, windows] when a Cursor/company Windows worker is online.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install print-agent dependencies
        working-directory: print-agent
        run: npm ci

      - name: Build Print Agent sidecar EXE
        working-directory: print-agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          npx pkg . --targets node18-win-x64 --output dist/reborn-print-agent.exe
          $bytes = [System.IO.File]::ReadAllBytes("dist/reborn-print-agent.exe")
          if ($bytes.Length -lt 1MB) { throw "Print Agent EXE too small ($($bytes.Length) bytes)" }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Print Agent EXE missing MZ header" }

      - name: Stage Print Agent for Tauri externalBin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item -Force print-agent/dist/reborn-print-agent.exe desktop/src-tauri/binaries/reborn-print-agent-x86_64-pc-windows-msvc.exe

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        env:
          CHASLAY_POS_URL: https://app.rebornsense.com/login
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:nsis

      - name: Stage download files
        shell: pwsh
        run: |
          $out = "desktop/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$out/*.exe" | Where-Object { $_.Name -notlike "*.sig" } | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found under $out" }
          New-Item -ItemType Directory -Force -Path backend/public/downloads | Out-Null
          Copy-Item $exe.FullName backend/public/downloads/reborn-pos-setup.exe
          Write-Host "Installer: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Update download manifests
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $nsisOut = "desktop/src-tauri/target/release/bundle/nsis"
          $signed = [bool](Get-ChildItem "$nsisOut/*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1)
          $setupManifest = @{
            name = "reborn-pos"
            displayName = "RebornPOS"
            description = "Fullscreen Windows kiosk for Reborn WebPOS. Hardware uses the Print Agent on 127.0.0.1:9101."
            version = $version
            exeFile = "reborn-pos-setup.exe"
            platform = "windows"
            builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            signed = $signed
            updater = $true
          }
          $setupManifest | ConvertTo-Json -Depth 5 | Set-Content backend/public/downloads/reborn-pos-setup.json
          if ($signed) {
            & "$PWD/scripts/write-reborn-pos-update-manifest.ps1" `
              -NsisBundleDir $nsisOut `
              -Version $version `
              -OutputPath backend/public/downloads/reborn-pos-update.json
          } else {
            Write-Warning "Skipping reborn-pos-update.json — TAURI_SIGNING_PRIVATE_KEY not configured"
          }

      - name: Publish RebornPOS installer to production downloads (SCP)
        if: github.ref == 'refs/heads/main' && github.repository == 'ihtxam/rebornSense'
        shell: pwsh
        env:
          REBORN_HOST: ${{ secrets.REBORN_HETZNER_HOST }}
          REBORN_USER: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          REBORN_KEY: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          REBORN_PORT: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'reborn_scp_key'
          $env:REBORN_KEY.Replace("`r`n", "`n").Replace("`n", [Environment]::NewLine) | Set-Content -Path $keyPath -Encoding ascii -NoNewline
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          $remote = "$($env:DEPLOY_PATH)/backend/public/downloads/"
          $port = if ($env:REBORN_PORT) { $env:REBORN_PORT } else { '22' }
          $target = "$($env:REBORN_USER)@$($env:REBORN_HOST):$remote"
          $files = @(
            'backend/public/downloads/reborn-pos-setup.exe',
            'backend/public/downloads/reborn-pos-setup.json'
          )
          if (Test-Path 'backend/public/downloads/reborn-pos-update.json') {
            $files += 'backend/public/downloads/reborn-pos-update.json'
          }
          foreach ($f in $files) {
            scp -P $port -i $keyPath -o StrictHostKeyChecking=no $f $target
          }
          Remove-Item -Force $keyPath
