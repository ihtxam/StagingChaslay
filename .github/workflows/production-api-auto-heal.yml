name: Production API auto-heal

# Runs on-host api-auto-heal.sh (3 failed deep probes → restart API, max once/hour).
# Does not replace fixing bad deploys — use with health watch alerts.

on:
  schedule:
    # UTC; only runs when this file is on the repo default branch and the workflow is enabled.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api-auto-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run auto-heal on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            export HEALTH_URL="https://app.rebornsense.com/api/health?deep=1"
            export DEPLOY_PATH="${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}"
            export DEPLOY_STACK=rebornsense
            export ENV_FILE="/root/rebornsense-secrets/.env.production"
            bash "$DEPLOY_PATH/scripts/api-auto-heal.sh"
