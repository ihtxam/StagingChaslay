name: Restart Rebornsense production

# Emergency: restart API + dashboard + Caddy without a full rebuild.
# Use when login shows "Network error" or app.rebornsense.com returns 5xx.

on:
  workflow_dispatch:

concurrency:
  group: deploy-rebornsense-production
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart stack over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            export DEPLOY_PATH="${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}"
            export DEPLOY_STACK=rebornsense
            export CADDYFILE="$DEPLOY_PATH/deploy/Caddyfile.rebornsense"
            cd "$DEPLOY_PATH"
            dc() {
              docker compose --env-file .env.production "$@"
            }
            echo "=== Restart Rebornsense @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            dc ps
            docker ps -aq --filter "name=rebornsense-api" | xargs -r docker rm -f 2>/dev/null || true
            dc up -d db
            sleep 5
            dc up -d --force-recreate api dashboard caddy
            sleep 25
            dc exec -T api wget -qO- http://127.0.0.1:3000/health || true
            curl -sf https://api.rebornsense.com/health || curl -sf https://app.rebornsense.com/api/health || true
            echo
            SHOP_HUB_CODE="$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://order.rebornsense.com/ 2>/dev/null || echo "000")"
            echo "shop hub https://order.rebornsense.com/ HTTP ${SHOP_HUB_CODE}"
            dc ps
