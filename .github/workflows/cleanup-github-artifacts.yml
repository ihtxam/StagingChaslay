name: Cleanup GitHub Actions artifacts

# Frees Actions artifact storage quota. Does not affect production downloads on app.rebornsense.com.

on:
  workflow_dispatch:
    inputs:
      older_than_days:
        description: Delete artifacts created more than this many days ago
        type: number
        default: 7
      dry_run:
        description: List only; do not delete
        type: boolean
        default: true

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OLDER_THAN_DAYS: ${{ inputs.older_than_days }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "${OLDER_THAN_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Cutoff (UTC): $cutoff (dry_run=$DRY_RUN)"
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            -q '.artifacts[] | select(.created_at < "'"$cutoff"'") | [.id, .name, .size_in_bytes, .created_at] | @tsv' \
          | while IFS=$'\t' read -r id name size created; do
              echo "artifact id=$id name=$name size=$size created=$created"
              if [[ "$DRY_RUN" != "true" ]]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              fi
            done
