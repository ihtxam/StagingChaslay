name: Deploy to Rebornsense

# Rebornsense production — manual deploy ONLY after staging is verified.
# Repo: https://github.com/ihtxam/rebornSense
# Server: app.rebornsense.com @ 91.98.41.165 (/root/rebornSense)
# Requires REBORN_HETZNER_* secrets (not HETZNER_* — test uses StagingChaslay repo).
#
# Workflow: test on app.chaslay.com first, then update `.deploy/rebornsense-production` to deploy production.

on:
  push:
    branches:
      - main
    paths:
      - '.deploy/rebornsense-production'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy (default main — use after staging sign-off)
        type: string
        default: main

concurrency:
  group: deploy-rebornsense-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            if [[ -z "${{ secrets.REBORN_HETZNER_HOST }}" ]]; then
              echo "ERROR: Set REBORN_HETZNER_HOST to the Rebornsense production server IP."
              echo "HETZNER_* secrets belong in the rebornChaslay repo (test server only)."
              exit 1
            fi
            export DEPLOY_PATH="${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}"
            export DEPLOY_STACK=rebornsense
            export CADDYFILE="$DEPLOY_PATH/deploy/Caddyfile.rebornsense"
            bash "$DEPLOY_PATH/scripts/deploy-hetzner.sh"
