name: Deploy to Rebornsense

# Rebornsense production — manual deploy ONLY after staging is verified.
# Repo: https://github.com/ihtxam/rebornSense
# Server: app.rebornsense.com @ 91.98.41.165 (/root/rebornSense)
# Requires REBORN_HETZNER_* secrets (not HETZNER_* — test uses StagingChaslay repo).
#
# Workflow: test on app.chaslay.com first, then ask the agent to "push to production"
# (agent runs: gh workflow run deploy-rebornsense.yml)

on:
  push:
    branches:
      - main
    paths:
      - '.deploy/rebornsense-production'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy (default main — use after staging sign-off)
        type: string
        default: main
      force_during_service_hours:
        description: >-
          Allow deploy during Europe/Zurich service hours (11:00–23:00).
          Leave off for routine releases — use night window instead.
        type: boolean
        default: false

concurrency:
  group: deploy-rebornsense-production
  # Never cancel an in-flight production deploy (back-to-back .deploy touches aborted #903).
  cancel-in-progress: false

jobs:
  service-hours-guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Block push deploy during restaurant service hours (Europe/Zurich)
        run: |
          set -euo pipefail
          hour="$(TZ=Europe/Zurich date +%H)"
          echo "Europe/Zurich local hour: $hour"
          if [ "$hour" -ge 11 ] && [ "$hour" -lt 23 ]; then
            echo "::error::Push-triggered production deploy is blocked during service hours (11:00–23:00 Europe/Zurich)."
            echo "Use workflow_dispatch with force_during_service_hours only for emergencies."
            exit 1
          fi
          echo "Outside service hours — deploy may proceed."

  deploy:
    needs: service-hours-guard
    if: always() && (needs.service-hours-guard.result == 'success' || needs.service-hours-guard.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Block manual deploy during service hours unless forced
        if: github.event_name == 'workflow_dispatch' && inputs.force_during_service_hours != true
        run: |
          set -euo pipefail
          hour="$(TZ=Europe/Zurich date +%H)"
          echo "Europe/Zurich local hour: $hour"
          if [ "$hour" -ge 11 ] && [ "$hour" -lt 23 ]; then
            echo "::error::Manual deploy blocked during service hours (11:00–23:00 Europe/Zurich)."
            echo "Re-run workflow_dispatch with force_during_service_hours=true for emergencies."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Fetch latest RebornPOS Windows installer
        id: fetch_installer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-reborn-pos-installer.sh

      - name: Publish RebornPOS installer to production downloads
        if: steps.fetch_installer.outcome == 'success'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          source: "backend/public/downloads/reborn-pos-setup.exe,backend/public/downloads/reborn-pos-setup.json"
          target: ${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}/backend/public/downloads/
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          command_timeout: 30m
          script_stop: true
          script: |
            if [[ -z "${{ secrets.REBORN_HETZNER_HOST }}" ]]; then
              echo "ERROR: Set REBORN_HETZNER_HOST to the Rebornsense production server IP."
              echo "HETZNER_* secrets belong in the rebornChaslay repo (test server only)."
              exit 1
            fi
            # PRODUCTION SAFEGUARD: never pass staging DB wipe flags to production deploy.
            unset RESET_STAGING_DB PRODUCTION_DB_FORCE_RESET FORCE_DB_RESET
            export DEPLOY_PATH="${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}"
            export DEPLOY_STACK=rebornsense
            export CADDYFILE="$DEPLOY_PATH/deploy/Caddyfile.rebornsense"
            # Dashboard/API deploy must not block on Bridge APK when Gradle is broken or stale.
            export SKIP_ANDROID_BRIDGE_BUILD=1
            export SKIP_ANDROID_POS_BUILD=1
            bash "$DEPLOY_PATH/scripts/pre-deploy-sanity-check.sh"
            bash "$DEPLOY_PATH/scripts/deploy-hetzner.sh"

      - name: Verify production health after deploy
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            CODE="$(curl -sS -o /tmp/prod-health.json -w '%{http_code}' --max-time 45 \
              "https://app.rebornsense.com/api/health?deep=1" || echo "000")"
            echo "attempt $attempt: HTTP $CODE"
            cat /tmp/prod-health.json 2>/dev/null || true
            echo
            if [ "$CODE" = "200" ] && jq -e '.database == "ok"' /tmp/prod-health.json >/dev/null 2>&1; then
              echo "Production health OK"
              exit 0
            fi
            sleep 30
          done
          echo "ERROR: production health did not recover after deploy"
          exit 1
