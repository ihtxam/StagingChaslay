name: Deploy to Rebornsense

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-rebornsense
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST || secrets.HETZNER_HOST }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            export DEPLOY_PATH="${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}"
            export DEPLOY_STACK=rebornsense
            export CADDYFILE="$DEPLOY_PATH/deploy/Caddyfile.rebornsense"
            bash "$DEPLOY_PATH/scripts/deploy-hetzner.sh"
            mkdir -p /root/rebornsense-recovery-backups/latest
            LEGACY_DUMP_URL="http://116.202.26.15:9876/legacy-manupos.dump"
            if curl -fsSL "$LEGACY_DUMP_URL" -o /root/rebornsense-recovery-backups/latest/legacy-manupos.dump; then
              cd "$DEPLOY_PATH"
              git fetch origin main
              git reset --hard origin/main
              chmod +x scripts/restore-rebornsense-dump.sh
              DUMP_FILE="/root/rebornsense-recovery-backups/latest/legacy-manupos.dump" CONFIRM=1 bash scripts/restore-rebornsense-dump.sh
            else
              echo "Legacy dump not reachable at $LEGACY_DUMP_URL — skipping restore"
            fi
