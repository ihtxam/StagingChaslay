name: Recover Rebornsense data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-rebornsense-data.yml'
      - 'scripts/recover-rebornsense-data.sh'
      - 'scripts/restore-rebornsense-dump.sh'

concurrency:
  group: recover-rebornsense-data
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [[ -z "${{ secrets.HETZNER_SSH_KEY }}" ]]; then
            echo "Missing HETZNER_SSH_KEY"
            exit 1
          fi
          if [[ -z "${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}" ]]; then
            echo "Missing REBORN_HETZNER_SSH_KEY"
            exit 1
          fi

      - name: Dump legacy Postgres on Chaslay host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 116.202.26.15
          username: ${{ secrets.HETZNER_USER || 'root' }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            BACKUP_DIR="/root/rebornsense-recovery-backups/ci-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR" /root/rebornsense-recovery-backups/latest
            DUMP="$BACKUP_DIR/legacy-manupos.dump"
            if docker inspect foodtruckpos-db-1 >/dev/null 2>&1; then
              docker exec foodtruckpos-db-1 pg_dump -U manupos -d manupos -Fc >"$DUMP"
            elif docker volume inspect foodtruckpos_postgres_data >/dev/null 2>&1; then
              TEMP_OLD="recover-old-pg-ci"
              docker rm -f "$TEMP_OLD" >/dev/null 2>&1 || true
              docker run -d --name "$TEMP_OLD" \
                -e POSTGRES_HOST_AUTH_METHOD=trust \
                -v foodtruckpos_postgres_data:/var/lib/postgresql/data \
                postgres:16-alpine >/dev/null
              for i in $(seq 1 30); do
                docker exec "$TEMP_OLD" pg_isready -U manupos -d manupos >/dev/null 2>&1 && break
                sleep 2
              done
              docker exec "$TEMP_OLD" pg_dump -U manupos -d manupos -Fc >"$DUMP"
              docker rm -f "$TEMP_OLD" >/dev/null 2>&1 || true
            else
              echo "ERROR: no foodtruckpos db container or volume on legacy host"
              exit 1
            fi
            test -s "$DUMP"
            cp -f "$DUMP" /root/rebornsense-recovery-backups/latest/legacy-manupos.dump
            ls -lh /root/rebornsense-recovery-backups/latest/legacy-manupos.dump
            docker exec foodtruckpos-db-1 psql -U manupos -d manupos -t -c "SELECT count(*) FROM merchants;" || true

      - name: Transfer dump to Rebornsense host
        env:
          LEGACY_HOST: 116.202.26.15
          LEGACY_USER: ${{ secrets.HETZNER_USER || 'root' }}
          LEGACY_PORT: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          REBORN_HOST: ${{ secrets.REBORN_HETZNER_HOST || '91.98.41.165' }}
          REBORN_USER: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER || 'root' }}
          REBORN_PORT: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          LEGACY_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          REBORN_KEY: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LEGACY_KEY" > ~/.ssh/legacy_key
          printf '%s\n' "$REBORN_KEY" > ~/.ssh/reborn_key
          chmod 600 ~/.ssh/legacy_key ~/.ssh/reborn_key
          DUMP="/root/rebornsense-recovery-backups/latest/legacy-manupos.dump"
          scp -P "$LEGACY_PORT" -i ~/.ssh/legacy_key -o StrictHostKeyChecking=no \
            "${LEGACY_USER}@${LEGACY_HOST}:${DUMP}" /tmp/legacy-manupos.dump
          test -s /tmp/legacy-manupos.dump
          ssh -p "$REBORN_PORT" -i ~/.ssh/reborn_key -o StrictHostKeyChecking=no \
            "${REBORN_USER}@${REBORN_HOST}" 'mkdir -p /root/rebornsense-recovery-backups/latest'
          scp -P "$REBORN_PORT" -i ~/.ssh/reborn_key -o StrictHostKeyChecking=no \
            /tmp/legacy-manupos.dump \
            "${REBORN_USER}@${REBORN_HOST}:/root/rebornsense-recovery-backups/latest/legacy-manupos.dump"
          ls -lh /tmp/legacy-manupos.dump

      - name: Restore on Rebornsense host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST || '91.98.41.165' }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER || 'root' }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}"
            DUMP="/root/rebornsense-recovery-backups/latest/legacy-manupos.dump"
            test -s "$DUMP"
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/restore-rebornsense-dump.sh
            DUMP_FILE="$DUMP" CONFIRM=1 bash scripts/restore-rebornsense-dump.sh
            docker compose -p rebornsense --env-file "$DEPLOY_PATH/.env.production" exec -T db psql -U manupos -d manupos -c \
              "SELECT 'merchants' AS tbl, count(*) FROM merchants UNION ALL SELECT 'superadmins', count(*) FROM superadmins;"
