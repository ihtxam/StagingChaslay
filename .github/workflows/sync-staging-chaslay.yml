name: Sync to StagingChaslay

# Deploy to TEST — mirrors rebornSense → ihtxam/StagingChaslay, which auto-deploys app.chaslay.com.
# cursor[bot] cannot push to StagingChaslay (403); GITHUB_TOKEN cannot push cross-repo.
# One-time setup: add STAGING_CHASLAY_SYNC_TOKEN to rebornSense repo secrets (see DEPLOY.md).
#
# Auto-sync on push to main (staging only). Production deploy stays manual.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to sync to test (default main)
        type: string
        default: main
      force_push:
        description: Force-push StagingChaslay main (recommended when histories diverged)
        type: boolean
        default: true

concurrency:
  group: sync-staging-chaslay
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check sync token
        id: token
        run: |
          if [ -z "${{ secrets.STAGING_CHASLAY_SYNC_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_CHASLAY_SYNC_TOKEN is not set. Skipping StagingChaslay sync."
            echo "Add the secret once (see DEPLOY.md § StagingChaslay sync), then re-run this workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.configured == 'true'
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0
          # GITHUB_TOKEN cannot push cross-repo; must not override PAT in push URL
          persist-credentials: false

      - name: Prepare staging tree
        if: steps.token.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # rebornSense-only workflows (must not land in StagingChaslay)
          rm -f .github/workflows/deploy-rebornsense.yml
          rm -f .github/workflows/recover-rebornsense-data.yml
          rm -f .github/workflows/restart-rebornsense.yml
          rm -f .github/workflows/restore-rebornsense-now.yml
          rm -f .github/workflows/sync-staging-chaslay.yml
          # Do not copy deploy-hetzner.yml overlay — STAGING_CHASLAY_SYNC_TOKEN often lacks
          # the workflow scope, which blocks the entire sync push. StagingChaslay already has
          # deploy-hetzner.yml; git remote + deploy key handling lives in scripts/deploy-hetzner.sh.

      - name: Push to StagingChaslay
        if: steps.token.outputs.configured == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.STAGING_CHASLAY_SYNC_TOKEN }}
          FORCE_PUSH: ${{ github.event.inputs.force_push || 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): mirror rebornSense ${{ github.event.inputs.ref || 'main' }} for StagingChaslay"
          fi
          git remote add staging "https://x-access-token:${SYNC_TOKEN}@github.com/ihtxam/StagingChaslay.git"
          if [ "$FORCE_PUSH" = "true" ]; then
            git push staging HEAD:main --force
          else
            git push staging HEAD:main
          fi
          echo "Synced $(git rev-parse --short HEAD) to ihtxam/StagingChaslay main"
