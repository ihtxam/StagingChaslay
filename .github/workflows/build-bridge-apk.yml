name: Build Bridge APK

# Slim path: JDK + Android cmdline-tools on the runner.
# Do NOT pull mingc/android-build-box — that image fills ubuntu-latest disk
# ("no space left on device" on run 35449045827 and every recent main build).
#
# After a successful build, APK + manifest are SCP'd to app.rebornsense.com (no GitHub artifact upload —
# avoids Actions storage quota). Optional self-hosted Linux runner on Hetzner: see
# .github/SELF_HOSTED_RUNNER_HETZNER.md

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Copy APK + JSON to app.rebornsense.com downloads
        type: boolean
        default: true
      runner:
        description: GitHub runner (use self-hosted after registering Hetzner worker)
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest
  push:
    branches:
      - main
    paths:
      - 'print-agent-android/**'
      - '.github/workflows/build-bridge-apk.yml'

concurrency:
  group: build-bridge-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Disk before SDK
        run: df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Write Adyen SDK keys when secrets exist
        env:
          ADYEN_SDK_API_KEY: ${{ secrets.ADYEN_SDK_API_KEY }}
          ADYEN_SDK_API_KEY_LIVE: ${{ secrets.ADYEN_SDK_API_KEY_LIVE }}
          ADYEN_SDK_ENV: ${{ secrets.ADYEN_SDK_ENV }}
        run: |
          {
            echo "adyenEnv=${ADYEN_SDK_ENV:-test}"
            if [[ -n "${ADYEN_SDK_API_KEY:-}" ]]; then
              echo "adyenSdkApiKey=${ADYEN_SDK_API_KEY}"
            fi
            if [[ -n "${ADYEN_SDK_API_KEY_LIVE:-}" ]]; then
              echo "adyenSdkApiKeyLive=${ADYEN_SDK_API_KEY_LIVE}"
            fi
          } >> print-agent-android/local.properties
          if [[ -n "${ADYEN_SDK_API_KEY:-}" || -n "${ADYEN_SDK_API_KEY_LIVE:-}" ]]; then
            echo "Adyen SDK keys present — Tap to Pay APK will be built"
          else
            echo "WARNING: ADYEN_SDK_API_KEY secret is empty — this will be a print-only APK"
          fi

      - name: Restore shared Bridge signing keystore (cache)
        uses: actions/cache@v4
        id: bridge-keystore-cache
        with:
          path: |
            ~/.android/debug.keystore
            ~/.config/.android/debug.keystore
          key: bridge-apk-signing-keystore-v1

      - name: Configure Bridge release keystore
        env:
          BRIDGE_KEYSTORE_BASE64: ${{ secrets.BRIDGE_KEYSTORE_BASE64 }}
          BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.BRIDGE_KEYSTORE_PASSWORD }}
          BRIDGE_KEY_ALIAS: ${{ secrets.BRIDGE_KEY_ALIAS }}
          BRIDGE_KEY_PASSWORD: ${{ secrets.BRIDGE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/.android" print-agent-android/.secrets
          if [[ -n "${BRIDGE_KEYSTORE_BASE64:-}" ]]; then
            echo "$BRIDGE_KEYSTORE_BASE64" | base64 -d > print-agent-android/.secrets/bridge-release.keystore
            {
              echo "bridgeStoreFile=.secrets/bridge-release.keystore"
              echo "bridgeStorePassword=${BRIDGE_KEYSTORE_PASSWORD:-android}"
              echo "bridgeKeyAlias=${BRIDGE_KEY_ALIAS:-bridge}"
              echo "bridgeKeyPassword=${BRIDGE_KEY_PASSWORD:-android}"
            } >> print-agent-android/local.properties
            echo "Using BRIDGE_KEYSTORE_BASE64 secret for release signing"
          else
            for ks in "$HOME/.android/debug.keystore" "$HOME/.config/.android/debug.keystore"; do
              if [[ ! -f "$ks" ]]; then
                keytool -genkeypair -v \
                  -keystore "$ks" \
                  -storepass android -alias androiddebugkey -keypass android \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -dname "CN=Reborn Print Bridge,O=Reborn,C=CH"
              fi
            done
            if [[ "${{ steps.bridge-keystore-cache.outputs.cache-hit || '' }}" == "true" ]]; then
              echo "Restored cached Bridge debug keystore for consistent APK signatures"
            else
              echo "Created new Bridge debug keystore (will be cached for future CI builds)"
            fi
          fi

      - name: Build APK
        working-directory: print-agent-android
        run: |
          set -euo pipefail
          mkdir -p ../backend/public/downloads
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --no-build-cache
          APK="$(find app/build/outputs/apk/release -name "*.apk" | head -1)"
          test -n "$APK"
          cp -f "$APK" ../backend/public/downloads/reborn-print-bridge.apk
          df -h

      - name: Verify APK version matches build.gradle
        id: bridge_verify
        run: |
          BRIDGE_VERSION="$(grep -E 'versionName\s*=' print-agent-android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -1)"
          APK_VERSION="$(python3 - <<'PY'
          import re, zipfile
          with zipfile.ZipFile("backend/public/downloads/reborn-print-bridge.apk") as z:
              data = z.read("AndroidManifest.xml")
          vers = set()
          for i in range(len(data) - 6):
              if data[i] == 0x30 and data[i+1] == 0 and data[i+2] == 0x2e and data[i+3] == 0:
                  j, s = i, ""
                  while j + 1 < len(data):
                      lo, hi = data[j], data[j+1]
                      if hi or lo == 0 or not ((0x30 <= lo <= 0x39) or lo == 0x2e):
                          break
                      s += chr(lo)
                      j += 2
                  if re.fullmatch(r"0\.\d+\.\d+", s):
                      vers.add(s)
          print(sorted(vers)[-1] if vers else "")
          PY
          )"
          echo "gradle=$BRIDGE_VERSION apk=$APK_VERSION"
          test "$APK_VERSION" = "$BRIDGE_VERSION"
          echo "version=$BRIDGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update download manifest
        run: |
          BRIDGE_VERSION="${{ steps.bridge_verify.outputs.version }}"
          cp -f backend/public/downloads/reborn-print-bridge.apk "backend/public/downloads/reborn-print-bridge-${BRIDGE_VERSION}.apk"
          python3 - <<PY
          import json, datetime
          from pathlib import Path
          manifest = Path("backend/public/downloads/reborn-print-bridge.json")
          data = json.loads(manifest.read_text())
          data["version"] = "$BRIDGE_VERSION"
          data["builtAt"] = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"
          data["signed"] = True
          manifest.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Publish Bridge APK to production downloads (SCP)
        if: >-
          secrets.REBORN_HETZNER_HOST != '' &&
          (
            (github.event_name == 'workflow_dispatch' && inputs.deploy_production) ||
            github.event_name == 'push'
          )
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          source: "backend/public/downloads/reborn-print-bridge.apk,backend/public/downloads/reborn-print-bridge.json,backend/public/downloads/reborn-print-bridge-${{ steps.bridge_verify.outputs.version }}.apk"
          target: ${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}/backend/public/downloads/
          overwrite: true

      - name: Verify production Bridge JSON
        if: >-
          secrets.REBORN_HETZNER_HOST != '' &&
          (
            (github.event_name == 'workflow_dispatch' && inputs.deploy_production) ||
            github.event_name == 'push'
          )
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REBORN_HETZNER_HOST }}
          username: ${{ secrets.REBORN_HETZNER_USER || secrets.HETZNER_USER }}
          key: ${{ secrets.REBORN_HETZNER_SSH_KEY || secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.REBORN_HETZNER_SSH_PORT || secrets.HETZNER_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            VER="${{ steps.bridge_verify.outputs.version }}"
            APK="${{ secrets.REBORN_HETZNER_DEPLOY_PATH || '/root/rebornSense' }}/backend/public/downloads/reborn-print-bridge.apk"
            test -f "$APK"
            head -c 2 "$APK" | grep -q PK
            curl -sf "https://app.rebornsense.com/downloads/reborn-print-bridge.json" | grep -q "\"version\": \"${VER}\""
            echo "Production Bridge v${VER} published OK"
