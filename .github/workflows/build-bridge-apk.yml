name: Build Bridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'print-agent-android/**'
      - '.github/workflows/build-bridge-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write Adyen SDK keys when secrets exist
        env:
          ADYEN_SDK_API_KEY: ${{ secrets.ADYEN_SDK_API_KEY }}
          ADYEN_SDK_API_KEY_LIVE: ${{ secrets.ADYEN_SDK_API_KEY_LIVE }}
          ADYEN_SDK_ENV: ${{ secrets.ADYEN_SDK_ENV }}
        run: |
          {
            echo "adyenEnv=${ADYEN_SDK_ENV:-test}"
            if [[ -n "${ADYEN_SDK_API_KEY:-}" ]]; then
              echo "adyenSdkApiKey=${ADYEN_SDK_API_KEY}"
            fi
            if [[ -n "${ADYEN_SDK_API_KEY_LIVE:-}" ]]; then
              echo "adyenSdkApiKeyLive=${ADYEN_SDK_API_KEY_LIVE}"
            fi
          } >> print-agent-android/local.properties
          if [[ -n "${ADYEN_SDK_API_KEY:-}" || -n "${ADYEN_SDK_API_KEY_LIVE:-}" ]]; then
            echo "Adyen SDK keys present — Tap to Pay APK will include NFC SDK"
          else
            echo "WARNING: ADYEN_SDK_API_KEY secret is empty — Tap to Pay APK will be a stub without NFC SDK"
          fi

      - name: Build APKs in Android container
        run: |
          set -euo pipefail
          mkdir -p backend/public/downloads
          docker run --rm \
            -e ANDROID_SDK_ROOT=/opt/android-sdk-linux \
            -e GRADLE_USER_HOME=/tmp/gradle-home \
            -v "$PWD/print-agent-android:/project" \
            -v "$PWD/backend/public/downloads:/out" \
            -w /project \
            mingc/android-build-box:latest \
            bash -c 'set -euo pipefail
              export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
              rm -rf /project/.gradle /project/app/build /tmp/gradle-home
              mkdir -p /opt/android-sdk/.android /tmp/gradle-home
              if [[ ! -f /opt/android-sdk/.android/debug.keystore ]]; then
                keytool -genkeypair -v \
                  -keystore /opt/android-sdk/.android/debug.keystore \
                  -storepass android -alias androiddebugkey -keypass android \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -dname "CN=Reborn Print Bridge,O=Reborn,C=CH"
              fi
              chmod +x ./gradlew
              ./gradlew assemblePrintRelease assembleTapToPayRelease --no-daemon --no-build-cache -g /tmp/gradle-home
              PRINT_APK="$(find app/build/outputs/apk/print/release -name "*.apk" | head -1)"
              TTP_APK="$(find app/build/outputs/apk/tapToPay/release -name "*.apk" | head -1)"
              test -n "$PRINT_APK"
              test -n "$TTP_APK"
              cp -f "$PRINT_APK" /out/reborn-print-bridge-print.apk
              cp -f "$TTP_APK" /out/reborn-print-bridge.apk
            '

      - name: Verify APK versions match build.gradle
        run: |
          BRIDGE_VERSION="$(grep -E 'versionName\s*=' print-agent-android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -1)"
          for APK in backend/public/downloads/reborn-print-bridge.apk backend/public/downloads/reborn-print-bridge-print.apk; do
            APK_VERSION="$(python3 - <<'PY' "$APK"
          import re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              data = z.read("AndroidManifest.xml")
          vers = set()
          for i in range(len(data) - 6):
              if data[i] == 0x30 and data[i+1] == 0 and data[i+2] == 0x2e and data[i+3] == 0:
                  j, s = i, ""
                  while j + 1 < len(data):
                      lo, hi = data[j], data[j+1]
                      if hi or lo == 0 or not ((0x30 <= lo <= 0x39) or lo == 0x2e):
                          break
                      s += chr(lo)
                      j += 2
                  if re.fullmatch(r"0\.\d+\.\d+", s):
                      vers.add(s)
          print(sorted(vers)[-1] if vers else "")
          PY
          )"
            echo "$APK gradle=$BRIDGE_VERSION apk=$APK_VERSION"
            test "$APK_VERSION" = "$BRIDGE_VERSION"
          done

      - name: Update download manifests
        run: |
          BRIDGE_VERSION="$(grep -E 'versionName\s*=' print-agent-android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -1)"
          python3 - <<PY
          import json, datetime
          from pathlib import Path
          built_at = datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z"
          for name, edition, has_ttp in [
              ("reborn-print-bridge", "tapToPay", True),
              ("reborn-print-bridge-print", "print", False),
          ]:
              manifest = Path(f"backend/public/downloads/{name}.json")
              data = json.loads(manifest.read_text()) if manifest.exists() else {}
              data.update({
                  "name": name,
                  "version": "$BRIDGE_VERSION",
                  "apkFile": f"{name}.apk",
                  "builtAt": built_at,
                  "platform": "android",
                  "edition": edition,
                  "hasTapToPay": has_ttp,
                  "signed": True,
              })
              manifest.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reborn-print-bridge-apks
          path: |
            backend/public/downloads/reborn-print-bridge.apk
            backend/public/downloads/reborn-print-bridge-print.apk
          retention-days: 30
