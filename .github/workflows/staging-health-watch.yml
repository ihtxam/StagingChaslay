name: Staging health watch

# Alerts when app.chaslay.com API/DB probes fail (test ring before production).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      auto_heal:
        description: Run server auto-heal if probe fails 3+ times (uses on-host state file)
        type: boolean
        default: false

concurrency:
  group: staging-health-watch
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shallow API health (staging)
        run: |
          set -euo pipefail
          URL="https://app.chaslay.com/api/health"
          CODE="$(curl -sS -o /tmp/staging-health.json -w '%{http_code}' --max-time 30 "$URL")"
          echo "GET $URL → HTTP $CODE"
          cat /tmp/staging-health.json || true
          echo
          test "$CODE" = "200"

      - name: Deep health (API + Postgres)
        run: |
          set -euo pipefail
          URL="https://app.chaslay.com/api/health?deep=1"
          CODE="$(curl -sS -o /tmp/staging-health-deep.json -w '%{http_code}' --max-time 45 "$URL")"
          echo "GET $URL → HTTP $CODE"
          cat /tmp/staging-health-deep.json || true
          echo
          test "$CODE" = "200"
          jq -e '.database == "ok"' /tmp/staging-health-deep.json >/dev/null

  auto-heal:
    needs: probe
    if: failure() && (github.event_name == 'workflow_dispatch' && inputs.auto_heal == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH auto-heal (staging)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            export HEALTH_URL="https://app.chaslay.com/api/health?deep=1"
            export DEPLOY_PATH="/root/StagingChaslay"
            export DEPLOY_STACK="chaslay"
            export ENV_FILE="/root/chaslay-secrets/.env.production"
            bash "$DEPLOY_PATH/scripts/api-auto-heal.sh"
