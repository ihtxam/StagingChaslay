name: Check migrations

# Deploys apply schema changes with `drizzle-kit migrate`, which runs only the
# .sql files committed under backend/drizzle/. A change to schema.ts without a
# generated migration deploys green while the database stays unchanged, so this
# job fails the PR instead.

on:
  pull_request:
    paths:
      - "backend/src/db/schema.ts"
      - "backend/drizzle/**"
      - "scripts/check-migrations-generated.sh"
      - ".github/workflows/check-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "backend/src/db/schema.ts"
      - "backend/drizzle/**"
  workflow_dispatch:

jobs:
  check:
    name: schema.ts has a matching migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Fail if schema.ts has no generated migration
        run: bash scripts/check-migrations-generated.sh
