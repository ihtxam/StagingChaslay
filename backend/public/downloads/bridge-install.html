<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install Bridge Reborn</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 36rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.45;
        color: #102027;
      }
      h1 { font-size: 1.4rem; }
      .box {
        border: 1px solid #cfd8dc;
        border-radius: 12px;
        padding: 1rem 1.1rem;
        background: #f7fafb;
      }
      ol { padding-left: 1.2rem; }
      a.btn {
        display: inline-block;
        margin-top: 0.75rem;
        background: #0f766e;
        color: #fff;
        text-decoration: none;
        padding: 0.8rem 1.1rem;
        border-radius: 10px;
        font-weight: 700;
      }
      .err { color: #b71c1c; }
    </style>
  </head>
  <body>
    <h1 id="title">Bridge Reborn</h1>
    <div class="box" id="content">
      <p>Loading latest version…</p>
    </div>
    <script>
      (function () {
        var content = document.getElementById("content");
        var title = document.getElementById("title");
        fetch("/downloads/reborn-print-bridge.json", { cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error("manifest " + r.status);
            return r.json();
          })
          .then(function (d) {
            var version = String(d.version || d.declaredVersion || "").trim();
            if (!version || d.available === false) {
              throw new Error(d.message || "Bridge APK not published");
            }
            var file = "reborn-print-bridge-" + version + ".apk";
            var href =
              d.downloadUrl ||
              "/downloads/reborn-print-bridge-" + version + ".apk?v=" + encodeURIComponent(version);
            document.title = "Install Bridge Reborn " + version;
            title.textContent = "Bridge Reborn v" + version;
            content.innerHTML =
              "<p>Do not open an old <code>reborn-print-bridge*.apk</code> already saved in Downloads. Delete old copies first.</p>" +
              "<ol>" +
              "<li>Android Settings → Apps → <strong>Bridge Reborn → Uninstall</strong></li>" +
              "<li>Files → Downloads → delete every <code>reborn-print-bridge*.apk</code></li>" +
              "<li>Tap the button below. Chrome must save <code>" +
              file +
              "</code></li>" +
              "<li>Open that new file, then open the Bridge app</li>" +
              "<li>The green header must say <strong>Bridge v" +
              version +
              "</strong></li>" +
              "</ol>" +
              '<a class="btn" href="' +
              href +
              '" download="' +
              file +
              '">Download Bridge v' +
              version +
              "</a>" +
              '<p><a href="' +
              href +
              '">Backup download link</a></p>';
          })
          .catch(function (e) {
            content.innerHTML =
              '<p class="err">Could not load Bridge download info. Try <a href="/downloads/reborn-print-bridge.apk">/downloads/reborn-print-bridge.apk</a> or Merchant Settings → Printing.</p>';
            console.error(e);
          });
      })();
    </script>
  </body>
</html>
