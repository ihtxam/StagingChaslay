# Reborn — proxy to Docker API (:13000) and dashboard (:13080)
# Keep existing nginx sites (e.g. wearedispatcher) on 80/443.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream reborn_api {
    server 127.0.0.1:13000;
}

upstream reborn_dashboard {
    server 127.0.0.1:13080;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.rebornsense.com api.rebornsense.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /health {
        proxy_pass http://reborn_api;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://reborn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 40m;
    }

    location /v1/ {
        proxy_pass http://reborn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 40m;
    }

    location /downloads/ {
        proxy_pass http://reborn_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Encoding;
    }

    # GitHub / manual deploy webhook → localhost receiver (scripts/deploy-webhook-receiver.py)
    location = /internal/git-deploy {
        proxy_pass http://127.0.0.1:9847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        client_max_body_size 2m;
        limit_except POST GET { deny all; }
    }

    location = /internal/git-deploy/health {
        proxy_pass http://127.0.0.1:9847/internal/git-deploy/health;
        proxy_set_header Host $host;
        limit_except GET { deny all; }
    }

    location / {
        proxy_pass http://reborn_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.rebornsense.com pay.rebornsense.com status.rebornsense.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://reborn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 40m;
    }

    location / {
        proxy_pass http://reborn_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
