[package]
name = "reborn-pos"
version = "0.1.0"
description = "RebornPOS Windows kiosk shell"
authors = ["Reborn"]
edition = "2021"

[lib]
name = "reborn_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
urlencoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
