<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RebornPOS</title>
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #17252b;
        --text: #faf8f3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .splash {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
      }
      .splash img {
        width: min(220px, 70vw);
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
      }
      .icon {
        width: 56px;
        height: 56px;
        object-fit: contain;
        border-radius: 12px;
      }
      .tagline {
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        opacity: 0.82;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
        border: 2px solid rgba(250, 248, 243, 0.18);
        border-top-color: var(--text);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash" role="status" aria-live="polite" aria-label="Starting RebornPOS">
      <img id="splash-logo" src="brand/reborn-logo-white.png" width="220" height="202" alt="RebornPOS" />
      <p id="splash-tagline" class="tagline">Restaurant POS &amp; online ordering</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
    <script>
      (function () {
        var fallback = "https://app.rebornsense.com";
        var origin =
          (window.__REBORN_POS_ORIGIN__ ||
            new URLSearchParams(location.search).get("origin") ||
            fallback).replace(/\/+$/, "");
        fetch(origin + "/api/public/desktop-branding")
          .then(function (res) {
            if (!res.ok) throw new Error("branding");
            return res.json();
          })
          .then(function (data) {
            var b = (data && data.branding) || {};
            var logo = document.getElementById("splash-logo");
            var tagline = document.getElementById("splash-tagline");
            if (b.backgroundColor) {
              document.documentElement.style.setProperty("--bg", b.backgroundColor);
              document.body.style.background = b.backgroundColor;
            }
            if (logo && b.splashUrl) {
              logo.src = b.splashUrl;
              logo.alt = b.appName || "RebornPOS";
            }
            if (tagline && b.tagline) tagline.textContent = b.tagline;
            if (b.appName) document.title = b.appName;
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
