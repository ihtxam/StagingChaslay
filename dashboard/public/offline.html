<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Reborn — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f766e;
        color: #ecfdf5;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.35rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
        color: #ccfbf1;
      }
      button {
        border: 0;
        border-radius: 0.5rem;
        padding: 0.65rem 1.1rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        background: #fff;
        color: #0f766e;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Reborn could not load from the network. Reconnect to the internet, then reopen the
        app. If you already used the POS online on this device, try again once — your catalog may
        still be available.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
