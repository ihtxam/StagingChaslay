<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var p = location.pathname || '';
        if (
          /\/merchant\/(pos|waiter)(\/|$)/.test(p) ||
          /^\/kds(\/|$)/.test(p) ||
          /^\/tv(\/|$)/.test(p)
        ) {
          var m = document.querySelector('meta[name="viewport"]');
          if (m) {
            m.setAttribute(
              'content',
              'width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover'
            );
          }
          document.documentElement.classList.add('webpos-lock');
          try {
            var ts = localStorage.getItem('webpos_text_size');
            if (ts === 'sm' || ts === 'md' || ts === 'lg' || ts === 'xl') {
              document.documentElement.setAttribute('data-webpos-text-size', ts);
            }
          } catch (e) {}
        }
      })();
    </script>
    <meta name="theme-color" content="#800020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reborn" />
    <meta name="application-name" content="Reborn" />
    <meta name="description" content="Reborn — installable Windows app" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Reborn</title>
    <script type="module" crossorigin src="/assets/index-BrJjpoyC.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DHNkJGWw.css">
  </head>
  <body>
    <div id="root">
      <div
        id="chaslay-boot"
        aria-live="polite"
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #17252b;
          color: #fff;
          font-family: system-ui, sans-serif;
        "
      >
        <div style="text-align: center; padding: 2rem">
          <p style="font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem">Reborn</p>
          <p id="chaslay-boot-msg" style="margin: 0; opacity: 0.9">Loading…</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('chaslay-boot');
        var msg = document.getElementById('chaslay-boot-msg');
        if (!boot || !msg) return;

        function showOffline() {
          if (!document.getElementById('chaslay-boot') || boot.dataset.offline) return;
          boot.dataset.offline = '1';
          msg.textContent =
            'You are offline. Open Reborn once while online to save the app shell, then relaunch.';
        }

        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) showOffline();
          },
          true
        );

        window.addEventListener('offline', function () {
          window.setTimeout(showOffline, 4000);
        });

        window.setTimeout(function () {
          if (document.getElementById('chaslay-boot')) {
            if (!navigator.onLine) showOffline();
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
